[project]
name = "ai-convos-db"
version = "0.6.0"
description = "Local-first searchable memory for ChatGPT, Claude, Claude Code, and Codex agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "typer>=0.12.0",
    "cryptography>=42.0.0",
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
explore = ["ai-convos-explore>=0.1,<0.2"]
memory = ["ai-convos-memory>=0.1,<0.2"]
redact = ["ai-convos-redact>=0.1,<0.2"]
resume = ["ai-convos-resume>=0.1,<0.2"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ai-convos-changegraph", "ai-convos-explore", "ai-convos-memory", "ai-convos-redact", "ai-convos-resume", "ai-convos-remote", "ai-convos-remote-server"]

[project.scripts]
convos = "ai_convos:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ai-convos-db/skills/agent-convos" = ["skills/agent-convos/SKILL.md"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
ai-convos-changegraph = { workspace = true }
ai-convos-explore = { workspace = true }
ai-convos-memory = { workspace = true }
ai-convos-redact = { workspace = true }
ai-convos-resume = { workspace = true }
ai-convos-remote-server = { workspace = true }
ai-convos-remote = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests as integration tests (may hit real APIs)", "slow: marks tests as slow"]
