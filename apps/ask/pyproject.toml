[project]
name = "ai-convos-ask"
version = "0.1.0"
description = "Private local archive answers with exact citations for ai-convos-db"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ai-convos-db>=0.6,<0.7", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/ai-convos-db/blob/master/docs/ask.md"
Repository = "https://github.com/RobertBiehl/ai-convos-db"

[project.entry-points."convos.commands"]
ask = "ai_convos_ask:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ai-convos-db = { workspace = true }
