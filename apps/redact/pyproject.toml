[project]
name = "ai-convos-redact"
version = "0.7.0"
description = "Local secret scanning and safe team projection policy for ai-convos-db"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ai-convos-db>=0.7,<0.8", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/ai-convos-db/blob/master/docs/redact.md"
Repository = "https://github.com/RobertBiehl/ai-convos-db"

[project.entry-points."convos.commands"]
redact = "ai_convos_redact:register"

[project.entry-points."convos.doctor"]
redact = "ai_convos_redact:doctor_status"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ai-convos-db = { workspace = true }
