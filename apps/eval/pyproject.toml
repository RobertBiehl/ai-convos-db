[project]
name = "ai-convos-eval"
version = "0.1.0"
description = "Reproducible offline retrieval evaluation for AI conversation archives"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ai-convos-db>=0.6,<0.7", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/ai-convos-db/blob/master/docs/eval.md"
Repository = "https://github.com/RobertBiehl/ai-convos-db"

[project.entry-points."convos.commands"]
eval = "ai_convos_eval:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ai-convos-db = { workspace = true }
