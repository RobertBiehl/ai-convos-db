[project]
name = "ai-convos-resume"
version = "0.1.0"
description = "Deterministic project handoff and session replay from exact conversation evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ai-convos-db>=0.6,<0.7", "ai-convos-redact>=0.1,<0.2", "typer>=0.12.0"]

[project.urls]
Documentation = "https://github.com/RobertBiehl/ai-convos-db/blob/master/docs/resume.md"
Repository = "https://github.com/RobertBiehl/ai-convos-db"

[project.entry-points."convos.commands"]
resume = "ai_convos_resume:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ai-convos-db = { workspace = true }
ai-convos-redact = { workspace = true }
